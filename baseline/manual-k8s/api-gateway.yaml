apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api-gateway
  namespace: demo-app
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: api-gateway
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: demo
      app.kubernetes.io/component: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/instance: demo
        app.kubernetes.io/component: api-gateway
        environment: dev
    spec:
      containers:
        - name: api-gateway
          image: hashicorp/http-echo:1.0
          imagePullPolicy: IfNotPresent
          args:
            - "-text=api-gateway"
          ports:
            - name: http
              containerPort: 5678
              protocol: TCP
          env:
            - name: APP_MODE
              value: api
            - name: USER_SERVICE_URL
              value: http://demo-user-service:8080
          envFrom:
            - configMapRef:
                name: demo-api-gateway
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api-gateway
  namespace: demo-app
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: api-gateway
    environment: dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-api-gateway
  namespace: demo-app
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: api-gateway
    environment: dev
spec:
  ingressClassName: nginx
  rules:
    - host: api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-api-gateway
                port:
                  number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-api-gateway
  namespace: demo-app
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: api-gateway
    environment: dev
data:
  ROUTING_MODE: internal
