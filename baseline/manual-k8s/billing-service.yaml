apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-billing-service
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: multiservice-demo
    app.kubernetes.io/managed-by: manual
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-billing-service-config
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: multiservice-demo
data:
  APP_MODE: "billing"
  LOG_LEVEL: "info"
  USER_SERVICE_URL: "http://demo-user-service.demo-app.svc.cluster.local:80"
  ORDER_SERVICE_URL: "http://demo-order-service.demo-app.svc.cluster.local:80"
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-billing-service-secret
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: multiservice-demo
type: Opaque
stringData:
  BILLING_TOKEN: "change-me"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-billing-service
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: multiservice-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-service
      app.kubernetes.io/instance: demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/instance: demo
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: multiservice-demo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: demo-billing-service
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: billing-service
          image: "registry.example.local/vkr/billing-service:dev"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: demo-billing-service-config
            - secretRef:
                name: demo-billing-service-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: demo-billing-service
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: multiservice-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/instance: demo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-billing-service
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: multiservice-demo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: billing-service
      app.kubernetes.io/instance: demo
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
              app.kubernetes.io/instance: demo
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: user-service
              app.kubernetes.io/instance: demo
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
              app.kubernetes.io/instance: demo
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-billing-service
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: multiservice-demo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-service
      app.kubernetes.io/instance: demo
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
