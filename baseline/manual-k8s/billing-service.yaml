apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-billing-service
  namespace: demo-app
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: billing-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-billing-service-config
  namespace: demo-app
  labels:
    app.kubernetes.io/name: billing-service
data:
  APP_NAME: billing-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-billing-service
  namespace: demo-app
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/instance: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-service
      app.kubernetes.io/instance: demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/instance: demo
        app.kubernetes.io/profile: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: demo-billing-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: billing-service
          image: billing-service:dev-local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: APP_ENV
              value: dev
            - name: SERVICE_NAME
              value: billing-service
            - name: APP_NAME
              value: billing-service
          envFrom:
            - configMapRef:
                name: demo-billing-service-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: demo-billing-service
  namespace: demo-app
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/instance: demo
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/instance: demo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-billing-service
  namespace: demo-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: billing-service
      app.kubernetes.io/instance: demo
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
              app.kubernetes.io/instance: demo
  egress:
    - {}
