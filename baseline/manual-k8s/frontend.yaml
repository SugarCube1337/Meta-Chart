apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-frontend
  namespace: demo-app
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: frontend
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: demo
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/instance: demo
        app.kubernetes.io/component: frontend
        environment: dev
    spec:
      containers:
        - name: frontend
          image: nginx:1.25
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: APP_MODE
              value: frontend
            - name: API_BASE_URL
              value: http://demo-api-gateway
          envFrom:
            - configMapRef:
                name: demo-frontend
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-frontend
  namespace: demo-app
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: frontend
    environment: dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-frontend
  namespace: demo-app
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: frontend
    environment: dev
spec:
  ingressClassName: nginx
  rules:
    - host: frontend.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-frontend
                port:
                  number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-frontend
  namespace: demo-app
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: frontend
    environment: dev
data:
  NGINX_PORT: "80"
  PUBLIC_PATH: "/"
