apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-notification-worker
  namespace: demo-app
  labels:
    app.kubernetes.io/name: notification-worker
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: notification-worker
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: demo
      app.kubernetes.io/component: notification-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-worker
        app.kubernetes.io/instance: demo
        app.kubernetes.io/component: notification-worker
        environment: dev
    spec:
      containers:
        - name: notification-worker
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - "while true; do echo processing notifications; sleep 30; done"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: APP_MODE
              value: worker
            - name: QUEUE_NAME
              value: notifications
          envFrom:
            - configMapRef:
                name: demo-notification-worker
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-notification-worker
  namespace: demo-app
  labels:
    app.kubernetes.io/name: notification-worker
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: notification-worker
    environment: dev
data:
  WORKER_INTERVAL_SECONDS: "30"
