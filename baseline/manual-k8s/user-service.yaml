apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-user-service
  namespace: demo-app
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: user-service
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: demo
      app.kubernetes.io/component: user-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
        app.kubernetes.io/instance: demo
        app.kubernetes.io/component: user-service
        environment: dev
    spec:
      containers:
        - name: user-service
          image: hashicorp/http-echo:1.0
          imagePullPolicy: IfNotPresent
          args:
            - "-text=user-service"
          ports:
            - name: http
              containerPort: 5678
              protocol: TCP
          env:
            - name: APP_MODE
              value: user-service
            - name: DB_HOST
              value: demo-postgres
          envFrom:
            - configMapRef:
                name: demo-user-service
            - secretRef:
                name: demo-user-service
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-user-service
  namespace: demo-app
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: user-service
    environment: dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: user-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-user-service
  namespace: demo-app
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: user-service
    environment: dev
data:
  USER_CACHE_TTL: "300"
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-user-service
  namespace: demo-app
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: user-service
    environment: dev
type: Opaque
stringData:
  DB_PASSWORD: change-me
