{{- $root := . -}}
{{- $defaults := .Values.defaults | default dict -}}
{{- $profiles := .Values.profiles | default dict -}}
{{- range $serviceName, $serviceConfig := .Values.services }}
{{- $profileName := default "api" $serviceConfig.profile -}}
{{- $profile := (get $profiles $profileName) | default dict -}}
{{- $service := mergeOverwrite (deepCopy $defaults) (deepCopy $profile) (deepCopy $serviceConfig) -}}
{{- if ($service.enabled | default true) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vkr.serviceName" (dict "root" $root "name" $serviceName) }}
  namespace: {{ include "vkr.namespace" $root }}
  labels:
{{ include "vkr.labels" (dict "root" $root "name" $serviceName) | indent 4 }}
spec:
  {{- if not $service.autoscaling.enabled }}
  replicas: {{ $service.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
{{ include "vkr.selectorLabels" (dict "root" $root "name" $serviceName) | indent 6 }}
  template:
    metadata:
      labels:
{{ include "vkr.selectorLabels" (dict "root" $root "name" $serviceName) | indent 8 }}
        app.kubernetes.io/profile: {{ $profileName | quote }}
        vkr.io/environment: {{ $root.Values.global.environment | quote }}
        {{- with $service.podLabels }}
{{ toYaml . | indent 8 }}
        {{- end }}
      annotations:
        {{- if and $root.Values.monitoring.enabled $root.Values.monitoring.prometheus.scrape $service.monitoring.enabled $service.monitoring.scrape }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ $service.monitoring.path | quote }}
        prometheus.io/port: {{ $service.monitoring.port | quote }}
        {{- end }}
        {{- with $service.podAnnotations }}
{{ toYaml . | indent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "vkr.serviceAccountName" (dict "root" $root "name" $serviceName) }}
      {{- with $service.podSecurityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: {{ include "vkr.kebab" $serviceName }}
          image: {{ include "vkr.serviceImage" (dict "root" $root "service" $service) | quote }}
          imagePullPolicy: {{ default $root.Values.global.imagePullPolicy $service.image.pullPolicy }}
          {{- with $service.command }}
          command:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $service.args }}
          args:
{{ toYaml . | indent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $service.containerPort }}
              protocol: TCP
          env:
            - name: APP_ENV
              value: {{ $root.Values.global.environment | quote }}
            - name: SERVICE_NAME
              value: {{ include "vkr.kebab" $serviceName | quote }}
            {{- range $key, $value := $service.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $depName, $dep := $service.dependencies }}
            - name: {{ $dep.envName }}
              value: {{ include "vkr.dependencyUrl" (dict "root" $root "dep" $dep) | quote }}
            {{- end }}
          {{- if or $service.config $service.secrets }}
          envFrom:
            {{- if $service.config }}
            - configMapRef:
                name: {{ include "vkr.serviceName" (dict "root" $root "name" $serviceName) }}-config
            {{- end }}
            {{- if $service.secrets }}
            - secretRef:
                name: {{ include "vkr.serviceName" (dict "root" $root "name" $serviceName) }}-secret
            {{- end }}
          {{- end }}
          {{- with $service.securityContext }}
          securityContext:
{{ toYaml . | indent 12 }}
          {{- end }}
          resources:
{{ toYaml $service.resources | indent 12 }}
          {{- if $service.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ $service.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ $service.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $service.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $service.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $service.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if $service.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ $service.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ $service.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $service.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $service.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $service.probes.readiness.failureThreshold }}
          {{- end }}
{{- end }}
{{- end }}
