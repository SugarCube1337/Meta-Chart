{{- $root := . -}}
{{- $defaults := .Values.defaults | default dict -}}
{{- $profiles := .Values.profiles | default dict -}}
{{- range $serviceName, $serviceConfig := .Values.services }}
{{- $profileName := default "api" $serviceConfig.profile -}}
{{- $profile := (get $profiles $profileName) | default dict -}}
{{- $service := mergeOverwrite (deepCopy $defaults) (deepCopy $profile) (deepCopy $serviceConfig) -}}
{{- if and ($service.enabled | default true) $service.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vkr.serviceName" (dict "root" $root "name" $serviceName) }}
  namespace: {{ include "vkr.namespace" $root }}
  labels:
{{ include "vkr.labels" (dict "root" $root "name" $serviceName) | indent 4 }}
  {{- with $service.ingress.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  {{- if $service.ingress.className }}
  ingressClassName: {{ $service.ingress.className }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress is enabled" $service.ingress.host }}
      http:
        paths:
          - path: {{ $service.ingress.path }}
            pathType: {{ $service.ingress.pathType }}
            backend:
              service:
                name: {{ include "vkr.serviceName" (dict "root" $root "name" $serviceName) }}
                port:
                  number: {{ $service.service.port }}
{{- end }}
{{- end }}
