{{- $root := . -}}
{{- $defaults := .Values.defaults | default dict -}}
{{- $profiles := .Values.profiles | default dict -}}
{{- if and .Values.serviceMesh.enabled (eq .Values.serviceMesh.provider "istio") }}
{{- range $serviceName, $serviceConfig := .Values.services }}
{{- $profileName := default "api" $serviceConfig.profile -}}
{{- $profile := (get $profiles $profileName) | default dict -}}
{{- $service := mergeOverwrite (deepCopy $defaults) (deepCopy $profile) (deepCopy $serviceConfig) -}}
{{- if and ($service.enabled | default true) $service.serviceMesh.virtualService.enabled }}
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "vkr.serviceName" (dict "root" $root "name" $serviceName) }}
  namespace: {{ include "vkr.namespace" $root }}
  labels:
{{ include "vkr.labels" (dict "root" $root "name" $serviceName) | indent 4 }}
spec:
  hosts:
{{ toYaml $service.serviceMesh.virtualService.hosts | indent 4 }}
  gateways:
    {{- if $service.serviceMesh.virtualService.gateways }}
{{ toYaml $service.serviceMesh.virtualService.gateways | indent 4 }}
    {{- else if $root.Values.serviceMesh.gateway.enabled }}
    - {{ default (include "vkr.namespace" $root) $root.Values.serviceMesh.gateway.namespace }}/{{ $root.Values.serviceMesh.gateway.name }}
    {{- else }}
    - mesh
    {{- end }}
  http:
    - match:
        - uri:
            prefix: {{ $service.serviceMesh.virtualService.pathPrefix | quote }}
      route:
        - destination:
            host: {{ include "vkr.serviceName" (dict "root" $root "name" $serviceName) }}.{{ include "vkr.namespace" $root }}.svc.cluster.local
            port:
              number: {{ $service.service.port }}
{{- end }}
{{- end }}
{{- end }}
