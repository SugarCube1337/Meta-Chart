{{- $root := . -}}
{{- $defaults := deepCopy (.Values.defaults | default dict) -}}
{{- range $serviceName, $serviceRaw := .Values.services }}
{{- $profileName := default "api" $serviceRaw.profile -}}
{{- $profile := deepCopy (index $.Values.profiles $profileName | default dict) -}}
{{- $service := mergeOverwrite (deepCopy $defaults) $profile (deepCopy $serviceRaw) -}}
{{- if and $service.enabled $service.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (include "meta-chart.serviceName" (dict "root" $root "serviceName" $serviceName)) $service.serviceAccount.name }}
  namespace: {{ include "meta-chart.namespace" $root }}
  labels:
{{ include "meta-chart.serviceLabels" (dict "root" $root "serviceName" $serviceName) | nindent 4 }}
{{- end }}
{{- end }}
