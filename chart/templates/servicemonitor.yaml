{{- $root := . -}}
{{- $defaults := .Values.defaults | default dict -}}
{{- $profiles := .Values.profiles | default dict -}}
{{- if and .Values.monitoring.enabled .Values.monitoring.prometheus.serviceMonitor.enabled }}
{{- range $serviceName, $serviceConfig := .Values.services }}
{{- $profileName := default "api" $serviceConfig.profile -}}
{{- $profile := (get $profiles $profileName) | default dict -}}
{{- $service := mergeOverwrite (deepCopy $defaults) (deepCopy $profile) (deepCopy $serviceConfig) -}}
{{- if and ($service.enabled | default true) $service.service.enabled $service.monitoring.enabled $service.monitoring.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "vkr.serviceName" (dict "root" $root "name" $serviceName) }}
  namespace: {{ default (include "vkr.namespace" $root) $root.Values.monitoring.prometheus.serviceMonitor.namespace }}
  labels:
{{ include "vkr.labels" (dict "root" $root "name" $serviceName) | indent 4 }}
{{- with $root.Values.monitoring.prometheus.serviceMonitor.labels }}
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  selector:
    matchLabels:
{{ include "vkr.selectorLabels" (dict "root" $root "name" $serviceName) | indent 6 }}
  namespaceSelector:
    matchNames:
      - {{ include "vkr.namespace" $root }}
  endpoints:
    - port: http
      path: {{ $service.monitoring.path }}
      interval: {{ $service.monitoring.serviceMonitor.interval }}
{{- end }}
{{- end }}
{{- end }}
