global:
  environment: dev
  namespace: demo-app
  imageRegistry: ""
  imageTag: dev-local
  imagePullPolicy: IfNotPresent
  nameOverride: ""
  fullnameOverride: ""
  commonLabels: {}
  commonAnnotations: {}

serviceAccount:
  create: true
  annotations: {}

defaults:
  enabled: true
  replicaCount: 1
  containerPort: 8080
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  command: []
  args: []
  service:
    enabled: true
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    host: ""
    path: /
    pathType: Prefix
    annotations: {}
  config: {}
  secrets: {}
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      enabled: true
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      enabled: true
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  monitoring:
    enabled: true
    path: /metrics
    port: 8080
    scrape: true
    serviceMonitor:
      enabled: false
      interval: 30s
  networkPolicy:
    enabled: true
    ingress:
      from: []
    egress:
      enabled: true
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  podAnnotations: {}
  podLabels: {}
  dependencies: {}
  serviceMesh:
    enabled: false
    virtualService:
      enabled: false
      hosts: []
      gateways: []
      pathPrefix: /
    destinationRule:
      enabled: false
      trafficPolicy: {}

profiles:
  web:
    service:
      enabled: true
      port: 80
    ingress:
      enabled: true
      path: /
    monitoring:
      enabled: true
      path: /metrics
      port: 8080
  api:
    service:
      enabled: true
      port: 80
    ingress:
      enabled: false
    monitoring:
      enabled: true
      path: /metrics
      port: 8080
  worker:
    service:
      enabled: true
      port: 80
    ingress:
      enabled: false
    monitoring:
      enabled: true
      path: /metrics
      port: 8080

monitoring:
  enabled: true
  prometheus:
    scrape: true
    serviceMonitor:
      enabled: false
      namespace: ""
      labels: {}

serviceMesh:
  enabled: false
  provider: istio
  gateway:
    enabled: false
    name: public-gateway
    namespace: ""
    selector:
      istio: ingressgateway
    hosts:
      - demo.local
    port: 80

services:
  frontend:
    enabled: true
    profile: web
    image:
      repository: frontend
    containerPort: 8080
    ingress:
      enabled: true
      host: frontend.local
      path: /
    env:
      APP_NAME: frontend
    dependencies:
      apiGateway:
        service: apiGateway
        envName: API_GATEWAY_URL
        protocol: http
        port: 80
    networkPolicy:
      ingress:
        from: []

  apiGateway:
    enabled: true
    profile: api
    image:
      repository: api-gateway
    containerPort: 8080
    ingress:
      enabled: true
      host: api.local
      path: /
    env:
      APP_NAME: api-gateway
    dependencies:
      userService:
        service: userService
        envName: USER_SERVICE_URL
        protocol: http
        port: 80
      orderService:
        service: orderService
        envName: ORDER_SERVICE_URL
        protocol: http
        port: 80
    networkPolicy:
      ingress:
        from:
          - frontend
    serviceMesh:
      virtualService:
        enabled: true
        hosts:
          - api.local
        pathPrefix: /
      destinationRule:
        enabled: true

  userService:
    enabled: true
    profile: api
    image:
      repository: user-service
    containerPort: 8080
    env:
      APP_NAME: user-service
    networkPolicy:
      ingress:
        from:
          - apiGateway

  orderService:
    enabled: true
    profile: api
    image:
      repository: order-service
    containerPort: 8080
    env:
      APP_NAME: order-service
    dependencies:
      notificationWorker:
        service: notificationWorker
        envName: NOTIFICATION_WORKER_URL
        protocol: http
        port: 80
    networkPolicy:
      ingress:
        from:
          - apiGateway

  notificationWorker:
    enabled: true
    profile: worker
    image:
      repository: notification-worker
    containerPort: 8080
    env:
      APP_NAME: notification-worker
      WORKER_MODE: background
    networkPolicy:
      ingress:
        from:
          - orderService
