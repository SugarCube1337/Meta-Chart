global:
  namespace: default
  environment: dev
  labels: {}
  annotations: {}

services:
  frontend:
    enabled: true
    replicas: 1

    image:
      repository: nginx
      tag: "1.25"
      pullPolicy: IfNotPresent

    service:
      enabled: true
      type: ClusterIP
      port: 80
      targetPort: 80

    ingress:
      enabled: false
      host: frontend.local
      path: /

    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "300m"
        memory: "256Mi"

    env:
      - name: APP_ENV
        value: dev

  backend:
    enabled: true
    replicas: 1

    image:
      repository: httpd
      tag: "2.4"
      pullPolicy: IfNotPresent

    service:
      enabled: true
      type: ClusterIP
      port: 8080
      targetPort: 80

    ingress:
      enabled: false
      host: backend.local
      path: /

    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "300m"
        memory: "256Mi"

    env: []