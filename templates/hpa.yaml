{{- range $serviceName, $rawService := .Values.services }}
{{- $profileName := $rawService.profile | default "default" -}}
{{- if not (hasKey $.Values.profiles $profileName) }}{{- fail (printf "services.%s.profile references unknown profile %q" $serviceName $profileName) }}{{- end }}
{{- $service := mergeOverwrite (deepCopy ($.Values.defaults | default dict)) (deepCopy (get $.Values.profiles $profileName)) (deepCopy $rawService) -}}
{{- if and $service.enabled $service.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "vkr-metachart.serviceFullname" (dict "root" $ "serviceName" $serviceName) }}
  namespace: {{ include "vkr-metachart.namespace" $ | quote }}
  labels:
    {{- include "vkr-metachart.serviceLabels" (dict "root" $ "serviceName" $serviceName "service" $service) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "vkr-metachart.serviceFullname" (dict "root" $ "serviceName" $serviceName) }}
  minReplicas: {{ $service.autoscaling.minReplicas | default 1 }}
  maxReplicas: {{ required (printf "services.%s.autoscaling.maxReplicas is required" $serviceName) $service.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $service.autoscaling.targetCPUUtilizationPercentage | default 70 }}
{{- end }}
{{- end }}
