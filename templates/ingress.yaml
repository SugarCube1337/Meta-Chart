{{- range $serviceName, $rawService := .Values.services }}
{{- $profileName := $rawService.profile | default "default" -}}
{{- if not (hasKey $.Values.profiles $profileName) }}{{- fail (printf "services.%s.profile references unknown profile %q" $serviceName $profileName) }}{{- end }}
{{- $service := mergeOverwrite (deepCopy ($.Values.defaults | default dict)) (deepCopy (get $.Values.profiles $profileName)) (deepCopy $rawService) -}}
{{- if and $service.enabled $service.ingress.enabled }}
{{- if not $service.service.enabled }}{{- fail (printf "services.%s.ingress.enabled=true requires service.enabled=true" $serviceName) }}{{- end }}
{{- if not $service.ingress.host }}{{- fail (printf "services.%s.ingress.host is required when ingress is enabled" $serviceName) }}{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vkr-metachart.serviceFullname" (dict "root" $ "serviceName" $serviceName) }}
  namespace: {{ include "vkr-metachart.namespace" $ | quote }}
  labels:
    {{- include "vkr-metachart.serviceLabels" (dict "root" $ "serviceName" $serviceName "service" $service) | nindent 4 }}
  {{- with $service.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $service.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with $service.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $service.ingress.host | quote }}
      http:
        paths:
          - path: {{ $service.ingress.path | default "/" | quote }}
            pathType: {{ $service.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "vkr-metachart.serviceFullname" (dict "root" $ "serviceName" $serviceName) }}
                port:
                  number: {{ $service.service.port }}
{{- end }}
{{- end }}
