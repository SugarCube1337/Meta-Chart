global:
  environment: prod
  imagePullPolicy: IfNotPresent

services:
  frontend:
    replicaCount: 3
    ingress:
      host: frontend.example.com
    resources:
      requests:
        cpu: "300m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1024Mi"
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70

  apiGateway:
    replicaCount: 3
    ingress:
      host: api.example.com
    resources:
      requests:
        cpu: "300m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1024Mi"
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      targetCPUUtilizationPercentage: 65

  userService:
    replicaCount: 3
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "700m"
        memory: "768Mi"
    secret:
      stringData:
        DB_PASSWORD: prod-password-placeholder

  notificationWorker:
    replicaCount: 2
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
