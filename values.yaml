global:
  applicationName: demo-multiservice-app
  namespace: demo-app
  environment: dev
  imagePullPolicy: IfNotPresent
  commonLabels: {}
  commonAnnotations: {}

defaults:
  enabled: true
  replicaCount: 1
  containerPort: 8080
  command: []
  args: []
  env: {}
  configMap:
    enabled: false
    data: {}
  secret:
    enabled: false
    stringData: {}
  service:
    enabled: true
    type: ClusterIP
    port: 80
    annotations: {}
  ingress:
    enabled: false
    className: nginx
    host: ""
    path: /
    pathType: Prefix
    annotations: {}
    tls: []
  probes:
    liveness:
      enabled: true
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      enabled: true
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 10
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

profiles:
  web:
    containerPort: 80
    service:
      enabled: true
      port: 80
    ingress:
      enabled: true
      path: /
      pathType: Prefix
    probes:
      liveness:
        path: /
      readiness:
        path: /

  api:
    containerPort: 5678
    service:
      enabled: true
      port: 80
    ingress:
      enabled: false
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false

  worker:
    service:
      enabled: false
    ingress:
      enabled: false
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

services:
  frontend:
    enabled: true
    profile: web
    image:
      repository: nginx
      tag: "1.25"
    ingress:
      host: frontend.local
    env:
      APP_MODE: frontend
      API_BASE_URL: http://demo-api-gateway
    configMap:
      enabled: true
      data:
        NGINX_PORT: "80"
        PUBLIC_PATH: "/"

  apiGateway:
    enabled: true
    profile: api
    image:
      repository: hashicorp/http-echo
      tag: "1.0"
    args:
      - "-text=api-gateway"
    ingress:
      enabled: true
      host: api.local
    env:
      APP_MODE: api
      USER_SERVICE_URL: http://demo-user-service:8080
    configMap:
      enabled: true
      data:
        ROUTING_MODE: internal

  userService:
    enabled: true
    profile: api
    image:
      repository: hashicorp/http-echo
      tag: "1.0"
    args:
      - "-text=user-service"
    service:
      port: 8080
    env:
      APP_MODE: user-service
      DB_HOST: demo-postgres
    configMap:
      enabled: true
      data:
        USER_CACHE_TTL: "300"
    secret:
      enabled: true
      stringData:
        DB_PASSWORD: change-me

  notificationWorker:
    enabled: true
    profile: worker
    image:
      repository: busybox
      tag: "1.36"
    command:
      - sh
      - -c
    args:
      - "while true; do echo processing notifications; sleep 30; done"
    env:
      APP_MODE: worker
      QUEUE_NAME: notifications
    configMap:
      enabled: true
      data:
        WORKER_INTERVAL_SECONDS: "30"
