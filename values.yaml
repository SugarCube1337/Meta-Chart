global:
  applicationName: demo-multiservice-app
  namespace: demo-app
  environment: dev
  imagePullPolicy: IfNotPresent
  commonLabels: {}
  commonAnnotations: {}

services:
  frontend:
    enabled: true
    replicaCount: 1
    image:
      repository: nginx
      tag: "1.25"
      pullPolicy: IfNotPresent
    containerPort: 80
    command: []
    args: []
    env:
      APP_MODE: frontend
      API_BASE_URL: http://demo-api-gateway
    configMap:
      enabled: true
      data:
        NGINX_PORT: "80"
        PUBLIC_PATH: "/"
    secret:
      enabled: false
      stringData: {}
    service:
      enabled: true
      type: ClusterIP
      port: 80
      annotations: {}
    ingress:
      enabled: true
      className: nginx
      host: frontend.local
      path: /
      pathType: Prefix
      annotations: {}
      tls: []
    probes:
      liveness:
        enabled: true
        path: /
        initialDelaySeconds: 10
        periodSeconds: 10
      readiness:
        enabled: true
        path: /
        initialDelaySeconds: 5
        periodSeconds: 10
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "300m"
        memory: "256Mi"
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70

  apiGateway:
    enabled: true
    replicaCount: 1
    image:
      repository: hashicorp/http-echo
      tag: "1.0"
      pullPolicy: IfNotPresent
    containerPort: 5678
    command: []
    args:
      - "-text=api-gateway"
    env:
      APP_MODE: api
      USER_SERVICE_URL: http://demo-user-service:8080
    configMap:
      enabled: true
      data:
        ROUTING_MODE: internal
    secret:
      enabled: false
      stringData: {}
    service:
      enabled: true
      type: ClusterIP
      port: 80
      annotations: {}
    ingress:
      enabled: true
      className: nginx
      host: api.local
      path: /
      pathType: Prefix
      annotations: {}
      tls: []
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70

  userService:
    enabled: true
    replicaCount: 1
    image:
      repository: hashicorp/http-echo
      tag: "1.0"
      pullPolicy: IfNotPresent
    containerPort: 5678
    command: []
    args:
      - "-text=user-service"
    env:
      APP_MODE: user-service
      DB_HOST: demo-postgres
    configMap:
      enabled: true
      data:
        USER_CACHE_TTL: "300"
    secret:
      enabled: true
      stringData:
        DB_PASSWORD: change-me
    service:
      enabled: true
      type: ClusterIP
      port: 8080
      annotations: {}
    ingress:
      enabled: false
      className: nginx
      host: user.local
      path: /
      pathType: Prefix
      annotations: {}
      tls: []
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "400m"
        memory: "384Mi"
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70

  notificationWorker:
    enabled: true
    replicaCount: 1
    image:
      repository: busybox
      tag: "1.36"
      pullPolicy: IfNotPresent
    containerPort: 8080
    command:
      - sh
      - -c
    args:
      - "while true; do echo processing notifications; sleep 30; done"
    env:
      APP_MODE: worker
      QUEUE_NAME: notifications
    configMap:
      enabled: true
      data:
        WORKER_INTERVAL_SECONDS: "30"
    secret:
      enabled: false
      stringData: {}
    service:
      enabled: false
      type: ClusterIP
      port: 8080
      annotations: {}
    ingress:
      enabled: false
      className: nginx
      host: worker.local
      path: /
      pathType: Prefix
      annotations: {}
      tls: []
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 2
      targetCPUUtilizationPercentage: 70
